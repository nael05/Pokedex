<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Pokédex</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Outfit', system-ui, sans-serif; 
            padding: 40px 20px; 
            max-width: 1000px; 
            margin: auto; 
            background: #0f172a; 
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
        }
        
        h1, h2, h3 { color: #ffffff; }
        .gradient-text { 
            text-align: center; 
            margin-bottom: 40px; 
            font-weight: 700; 
            font-size: 3rem; 
            letter-spacing: -0.05em; 
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        h2 { font-size: 1.8rem; font-weight: 600; margin-top: 50px; margin-bottom: 20px; }
        
        .pokemon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }
        
        .pokemon-card { 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; 
            padding: 24px; 
            background: rgba(30, 41, 59, 0.5); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .pokemon-card:hover {
            transform: translateY(-5px);
            background: rgba(30, 41, 59, 0.8); 
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .pokemon-card img { 
            width: 80px; 
            height: 80px; 
            object-fit: contain; 
            filter: drop-shadow(0 8px 8px rgba(0,0,0,0.3));
        }
        
        .pokemon-info { flex-grow: 1; }
        .pokemon-info strong { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }
        .poke-id { color: #94a3b8; font-size: 0.9rem; margin-left: 5px; font-weight: 500; }
        
        .pokemon-stats { margin-top: 12px; display: flex; gap: 10px; }
        .stat-badge { 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 0.85rem;
            font-weight: 600; 
            letter-spacing: 0.05em;
        }
        .hp-badge { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .cp-badge { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        
        .card-actions {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }
        
        button { 
            cursor: pointer; 
            padding: 10px 16px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
            flex: 1;
        }
        
        .btn-edit { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .btn-edit:hover { background: rgba(245, 158, 11, 0.25); }
        
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-delete:hover { background: rgba(239, 68, 68, 0.25); }
        
        .btn-submit { 
            background: linear-gradient(135deg, #3b82f6, #8b5cf6); 
            color: white; 
            width: 100%; 
            padding: 16px; 
            margin-top: 10px; 
            font-size: 1.1rem; 
            border-radius: 14px; 
            box-shadow: 0 10px 20px -10px rgba(139, 92, 246, 0.5); 
        }
        .btn-submit:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 15px 25px -10px rgba(139, 92, 246, 0.7); 
            filter: brightness(1.1);
        }
        
        form { 
            padding: 40px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px; 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        
        form h3 { margin-top: 0; margin-bottom: 10px; font-size: 1.6rem; letter-spacing: -0.02em; }
        
        input {
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            font-size: 1rem;
            font-family: inherit;
            color: white;
            outline: none;
            transition: all 0.2s ease;
            background: rgba(15, 23, 42, 0.6);
        }
        input::placeholder { color: #64748b; }
        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }
    </style>
</head>
<body>
    <h1 class="gradient-text">Mon Pokédex</h1>

    <form id="pokemonForm">
        <h3 id="formTitle">Ajouter un nouveau Pokémon</h3>
        <input type="hidden" id="pokeId">
        <input type="text" id="pokeName" placeholder="Nom du Pokémon" required>
        <input type="number" id="pokeHp" placeholder="Points de vie (HP)" required>
        <input type="number" id="pokeCp" placeholder="Dégâts (CP)" required>
        <input type="url" id="pokePic" placeholder="URL de l'image (https://...)" required>
        <button type="submit" class="btn-submit">Sauvegarder le Pokémon</button>
    </form>

    <h2>Liste des Pokémons</h2>
    <div id="pokemonList" class="pokemon-grid">
    </div>

    <script>
        const API_URL = '/api/pokemons';

        async function fetchPokemons() {
            const response = await fetch(API_URL);
            const resData = await response.json();
            const pokemons = resData.data;
            
            const list = document.getElementById('pokemonList');
            list.innerHTML = '';
            
            pokemons.forEach(p => {
                list.innerHTML += `
                    <div class="pokemon-card">
                        <div class="card-header">
                            <img src="${p.picture}" alt="${p.name}">
                            <div class="pokemon-info">
                                <strong>${p.name}</strong> <span class="poke-id">#${p.id}</span>
                                <div class="pokemon-stats">
                                    <span class="stat-badge hp-badge">HP: ${p.hp}</span>
                                    <span class="stat-badge cp-badge">CP: ${p.cp}</span>
                                </div>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="btn-edit" onclick="prepareEdit(${p.id})">Modifier</button>
                            <button class="btn-delete" onclick="deletePokemon(${p.id})">Supprimer</button>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('pokemonForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('pokeId').value;
            const pokemonData = {
                name: document.getElementById('pokeName').value,
                hp: parseInt(document.getElementById('pokeHp').value),
                cp: parseInt(document.getElementById('pokeCp').value),
                picture: document.getElementById('pokePic').value,
                types: ["Normal"]
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pokemonData)
            });

            document.getElementById('pokemonForm').reset();
            document.getElementById('pokeId').value = '';
            document.getElementById('formTitle').innerText = 'Ajouter un nouveau Pokémon';
            fetchPokemons();
        });

        async function prepareEdit(id) {
            const response = await fetch(`${API_URL}/${id}`);
            const resData = await response.json();
            const p = resData.data;

            document.getElementById('pokeId').value = p.id;
            document.getElementById('pokeName').value = p.name;
            document.getElementById('pokeHp').value = p.hp;
            document.getElementById('pokeCp').value = p.cp;
            document.getElementById('pokePic').value = p.picture;
            document.getElementById('formTitle').innerText = `Modifier le Pokémon n°${p.id}`;
            window.scrollTo(0, 0);
        }

        async function deletePokemon(id) {
            if(confirm('Voulez-vous vraiment supprimer ce Pokémon ?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchPokemons();
            }
        }

        fetchPokemons();
    </script>
</body>
</html>
